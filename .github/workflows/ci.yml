# Readout CI. Runs on Linux with the runner's Google Chrome. Uses no secrets: the browser checks fake Flagsmith
# locally and the build gets a Development env name with no key (practice only).
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      VITE_FLAGSMITH_ENV_NAME: development
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the freeze check needs the measured-v1 tag
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:isolation
      - run: npm run check:secrets
      - run: npm run check:frozen
      - run: npm run build
      - run: npm run check:browser
      - run: npm run check:browser:prod
      - run: npm run check:arms

  # The release gate (G-4): on a measured-v1 tag push, and before any Production start, the freeze must exist.
  release-gate:
    if: github.ref == 'refs/tags/measured-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:release
